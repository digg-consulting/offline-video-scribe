[project]
name = "offline-video-scribe"
version = "0.1.0"
description = "Offline Video Scribe (OVS) — local video transcription with mlx-whisper"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mlx-whisper>=0.4.3",
    "pyannote.audio>=4.0.0",
    "watchdog>=4.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
offline-video-scribe = "ovs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-packages = true
packages = ["src/ovs"]

[tool.hatch.build.targets.wheel.force-include]
"config/config.yaml.example" = "ovs/config.yaml.example"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
